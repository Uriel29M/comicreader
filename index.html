<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101114"><title>ComicReader</title><link rel="stylesheet" href="./reader.css"></head>
<body><header class="toolbar"><a class="brand" href="./">Comic<span>Reader</span></a><div class="edition-title"><strong id="editionTitle">Leitor de quadrinhos</strong><small id="editionMeta">PDF · CBZ · imagens</small></div><div class="toolbar-actions"><button id="scrollMode" aria-pressed="false">Rolagem</button><button id="spreadMode" aria-pressed="false">2 páginas</button><button id="fitMode">Ajustar</button></div></header>
<main id="reader" class="reader" aria-label="Páginas da edição"><div id="status" class="status">Preparando leitor…</div><div id="pages" class="pages"></div></main>
<footer class="controls"><button id="previous" aria-label="Página anterior">‹</button><span id="pageCounter">— / —</span><input id="pageInput" aria-label="Ir para página" type="number" min="1" value="1"><button id="goPage">Ir</button><button id="next" aria-label="Próxima página">›</button></footer><div id="error" class="error" hidden></div><script type="module" src="./reader.js"></script></body></html>
