<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Leitor — Banca Digital</title>
  <meta name="description" content="Leitor de quadrinhos da Banca Digital.">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon.png?v=20261024">
  <link rel="stylesheet" href="https://uriel29m.github.io/bancadigital/css/style.css?v=2.2.10.267-telegram-minimize-click-through">
</head>
<body>
  <section class="reader-overlay" id="reader-overlay" aria-label="Leitor de quadrinhos">
    <div class="reader-top">
      <div class="reader-top-primary">
        <a class="small-btn" data-close-reader id="closeReader" href="https://uriel29m.github.io/bancadigital/" style="display:inline-flex;align-items:center;text-decoration:none">← Voltar</a>
        <div class="reader-title" id="editionTitle">Carregando edição…</div>
        <a class="small-btn" data-reader-home id="readerHome" href="https://uriel29m.github.io/bancadigital/" style="display:inline-flex;align-items:center;text-decoration:none">Início</a>
      </div>
      <div class="reader-top-reading">
        <select class="small-btn" id="reading-mode-select" disabled aria-label="Modo de leitura">
          <option value="single-page">Página por página</option>
          <option value="double-page">Duas páginas</option>
          <option value="continuous-scroll">Rolagem contínua</option>
        </select>
        <button class="small-btn" id="reading-direction-btn" type="button" hidden>↔ Ocidental</button>
        <button class="small-btn" id="toggleCover" data-toggle-cover type="button" hidden>Ignorar capa</button>
        <button class="small-btn" id="toggleGrayscale" data-toggle-grayscale type="button">Preto e branco</button>
        <button class="small-btn" id="fitMode" data-reader-zoom type="button">Zoom</button>
      </div>
      <div class="reader-top-actions"></div>
    </div>
    <div id="reader-body" class="reader-body" aria-label="Páginas da edição"></div>
    <div class="reader-bottom-controls">
      <div class="reader-series-controls reader-series-prev" id="reader-series-prev"></div>
      <div class="reader-controls" id="reader-controls">
        <button id="previous" type="button" aria-label="Página anterior" disabled>‹</button>
        <span id="pageCounter" class="reader-page">O primeiro carregamento costuma ser demorado.</span>
        <button id="next" type="button" aria-label="Próxima página" disabled>›</button>
      </div>
      <div class="reader-series-controls reader-series-next" id="reader-series-next"></div>
    </div>
    <div class="reader-footer">
      <span></span>
      <div class="reader-footer-actions"><span id="editionMeta"></span></div>
      <div class="reader-error" id="error" hidden></div>
    </div>
  </section>
  <script src="https://uriel29m.github.io/bancadigital/js/reader-deps.js?v=5-progressive-telegram"></script>
  <script type="module" src="./reader.js?v=admin-real-page-download-20261028-r12"></script>
</body>
</html>
